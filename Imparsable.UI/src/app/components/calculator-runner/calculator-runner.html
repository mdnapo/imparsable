<!--suppress AngularForBlockNonIterableVar -->
<main>
  <mat-toolbar>
    <div>Runner</div>
    <button matIconButton class="example-icon" (click)="context.run()" aria-label="Example icon-button with share icon">
      <mat-icon>play_arrow</mat-icon>
    </button>
  </mat-toolbar>
  <section id="output">
    @for (line of context.output | async; track line.id) {
      <code>{{ line.text }}</code><br/>
    }
  </section>
</main>
