<!--suppress AngularForBlockNonIterableVar -->
<main>
  <mat-toolbar>
    <div>Runner</div>
    <button matIconButton (click)="context.execute()" [disabled]="!(context.file | async)">
      <mat-icon>play_arrow</mat-icon>
    </button>
  </mat-toolbar>
  <section id="output">
    @for (line of context.output | async; track line.id) {
      <code>{{ line.text }}</code><br/>
    }
  </section>
</main>
