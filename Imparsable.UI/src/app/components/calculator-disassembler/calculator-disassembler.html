<!--suppress AngularForBlockNonIterableVar -->
<main>
  <mat-toolbar>
    <div>Disassembler</div>
    <button matIconButton (click)="context.disassemble()" [disabled]="!(context.file | async)">
      <mat-icon>play_arrow</mat-icon>
    </button>
  </mat-toolbar>
  <section id="output">
    <pre style="white-space: preserve">{{ context.disassembly | async }}</pre>
  </section>
</main>
