<main #ide class="ide"
      [class.side-view-open]="sideView !== undefined"
      [class.bottom-view-open]="bottomView !== undefined"
      [style.--side-view-width.px]="sideViewWidth"
      [style.--bottom-view-height.px]="bottomViewHeight">

  <aside class="activity-bar">
    <div class="toolbar toolbar-top">
      @for (view of sideViews; track view.id) {
        <button mat-icon-button
                [class.active]="sideView?.id === view.id"
                (click)="toggleSideView(view)">
          <mat-icon>{{ view.icon }}</mat-icon>
        </button>
      }
    </div>

    <div class="toolbar toolbar-bottom">
      @for (view of bottomViews; track view.id) {
        <button mat-icon-button
                [class.active]="bottomView?.id === view.id"
                (click)="toggleBottomView(view)"
                [matBadge]="view.badge?.()"
                [matBadgeHidden]="view.badge === undefined || view.badge() === 0">
          <mat-icon>{{ view.icon }}</mat-icon>
        </button>
      }
    </div>
  </aside>

  @if (sideView !== undefined) {
    <section class="side-view-window">
      <div class="tool-window">
        <ng-container *ngComponentOutlet="sideView!.view"/>
      </div>
    </section>
  }

  <div class="vertical-resizer" (pointerdown)="startSideViewResize($event, ide)"></div>

  <main class="editor">
    @if (file) {
      <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start" class="ide-tabs">
        <mat-tab>
          <ng-template mat-tab-label>
            <div class="tab-label" [title]="file.path">
              <mat-icon class="file-icon">description</mat-icon>
              <span class="file-name">
                {{ file.dirty() ? '• ' : '' }}{{ file.name }}
              </span>
              <button class="close-button" type="button" (click)="closeFile($event, file)">
                <mat-icon>close</mat-icon>
              </button>
            </div>
          </ng-template>
        </mat-tab>
      </mat-tab-group>
    }

    <div class="editor-content" [hidden]="file == null">
      <ngx-monaco-editor class="monaco" (onInit)="onInit.emit($event)"/>
    </div>
  </main>

  <div class="horizontal-resizer" (pointerdown)="startBottomViewResize($event, ide)"></div>

  @if (bottomView !== undefined) {
    <section class="bottom-view-window">
      <div class="tool-window">
        <ng-container *ngComponentOutlet="bottomView!.view"/>
      </div>
    </section>
  }
</main>
