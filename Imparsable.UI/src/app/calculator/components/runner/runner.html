<app-tool-window title="Runner">
  <button actions
          matIconButton
          class="action-button"
          aria-label="Run"
          title="Run"
          [disabled]="!(context.file | async)"
          (click)="service.execute()">
    <mat-icon>play_arrow</mat-icon>
  </button>

  <div class="output">
    @for (line of service.output | async; track line.id) {
      <div class="output-line">{{ line.text }}</div>
    } @empty {
      <div class="empty">
        <mat-icon>terminal_2</mat-icon>
        <span>Run the current file to see its output.</span>
      </div>
    }
  </div>
</app-tool-window>
