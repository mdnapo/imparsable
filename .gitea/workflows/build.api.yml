name: build-api
run-name: ${{ gitea.actor }} triggered a build of Imparsable API
on:
  workflow_call:
    inputs:
      tag:
        description: The build tag
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish Imparsable API
        run: |
          #!/usr/bin/env bash
          
          # Login to the registry
          echo ${{ secrets.REGISTRY_PASS }} | \
          docker login ${{ secrets.REGISTRY_HOST }} \
            --username ${{ secrets.REGISTRY_USER }} \
            --password-stdin
          
          # Build image 
          TAGGED_IMAGE="${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_USER }}/imparsable-api:${{ inputs.tag }}"
          echo "Building image $TAGGED_IMAGE"
          docker build -f Imparsable.API/Dockerfile -t $TAGGED_IMAGE .
          
          # Push image
          echo "Pushing image $TAGGED_IMAGE"
          docker push $TAGGED_IMAGE
